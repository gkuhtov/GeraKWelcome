name: Build WelcomeToJapan Dylib

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "WelcomeToJapan/**"
      - ".github/workflows/build-welcome-to-japan.yml"
  pull_request:
    branches:
      - main
    paths:
      - "WelcomeToJapan/**"
      - ".github/workflows/build-welcome-to-japan.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install ldid

      - name: Setup Theos & SDKs
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          curl -fsSL https://github.com/theos/sdks/archive/master.zip -o ~/sdks.zip
          unzip -q ~/sdks.zip -d ~/
          mv ~/sdks-master/*.sdk ~/theos/sdks/
          rm -rf ~/sdks.zip ~/sdks-master

      - name: Build Dylib
        run: |
          export THEOS=~/theos
          cd WelcomeToJapan
          make clean
          make FINALPACKAGE=1
          mkdir -p output
          find .theos/obj -name "WelcomeToJapan.dylib" -exec cp {} output/ \;

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WelcomeToJapan-dylib
          path: WelcomeToJapan/output/WelcomeToJapan.dylib
